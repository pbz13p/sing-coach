name: 自动改进机器人

on:
  schedule:
    - cron: "27 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: auto-improve
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null || true
          pip install -q playwright || true
          pip install -q claude-agent-sdk httpx
          echo 'no extra deps'
      - name: 运行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOTAL_CAP_USD: "10"
          RUNS_PER_DAY: "4"
          DEADLINE: "2026-11-14T12:00:00+00:00"
          AUTO_MERGE: "1"
          TEST_CMD: "node tools/test.js && node tools/test2.js && node tools/test3.js && node tools/test4.js && node tools/test5.js"
          MODEL: "claude-opus-5-5"
        run: python .github/auto-improve/run.py
      - name: 预算没用完就马上接着跑下一轮
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY' && gh workflow run auto-improve.yml --ref main || echo "不再接着跑"
          import json, os, datetime as dt, sys, pathlib
          p = pathlib.Path(".auto-improve/spend.json")
          s = json.loads(p.read_text()) if p.exists() else {"total_usd": 0}
          cap = float("29"); dl = dt.datetime.fromisoformat("2026-11-14T12:00:00+00:00")
          ok = s["total_usd"] < cap - 0.5 and dt.datetime.now(dt.timezone.utc) < dl - dt.timedelta(minutes=30)
          print("已花", s["total_usd"], "/", cap, "接着跑" if ok else "停")
          sys.exit(0 if ok else 1)
          PY
