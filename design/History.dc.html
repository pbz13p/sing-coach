<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>唱准了 练唱记录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d8bf8f}a:hover{color:#f4efe6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0d1626; color: #f4efe6; font-family: 'Noto Sans SC', sans-serif; padding: 52px 20px 28px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="返回首页" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: rgba(255,255,255,.05)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f4efe6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 28px; font-weight: 700">我的练唱记录</h1>
  </div>

  <div style="border-radius: 20px; padding: 18px 20px; background: #142238; border: 1px solid rgba(216,191,143,.25); display: flex; justify-content: space-between; align-items: center">
    <span style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; color: #9aa6b8">这个星期</span>
      <span style="font-size: 20px; font-weight: 500">唱了 6 次，进步了 9 分</span>
    </span>
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#7fd1ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"></path></svg>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="border-radius: 16px; padding: 12px 12px 12px 18px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 14px">
        <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
          <span style="font-size: 19px">{{r.song}}</span>
          <span style="font-size: 14px; color: #9aa6b8">{{r.when}}</span>
        </span>
        <span style="font-family: 'Noto Serif SC', serif; font-size: 24px; font-weight: 700; color: {{r.c}}">{{r.score}}</span>
        <button aria-label="听这次的录音" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid rgba(216,191,143,.4); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#d8bf8f" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        </button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = (s) => (s >= 80 ? '#7fd1ae' : s >= 65 ? '#e9b872' : '#ee8574');
    const rows = [
      ['茉莉花', '今天 晚上 8:20', 82], ['茉莉花', '今天 晚上 8:05', 76],
      ['月亮代表我的心', '昨天 下午 3:40', 71], ['甜蜜蜜', '昨天 下午 3:10', 68],
      ['茉莉花', '11月4日', 73], ['我和我的祖国', '11月3日', 64]
    ];
    return { rows: rows.map(([song, when, score]) => ({ song, when, score, c: c(score) })) };
  }
}
</script>
</body>
</html>
