<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>唱准了 唱歌中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d8bf8f}a:hover{color:#f4efe6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0d1626; color: #f4efe6; font-family: 'Noto Sans SC', sans-serif; padding: 52px 0 36px; display: flex; flex-direction: column; gap: 20px">
  <div style="padding: 0 20px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="返回首页" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: rgba(255,255,255,.05)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f4efe6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-family: 'Noto Serif SC', serif; font-size: 20px; font-weight: 600">茉莉花</span>
      <span style="font-size: 14px; color: #9aa6b8; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #ee8574"></span>正在听您唱 · 01:12</span>
    </div>
    <span style="width: 48px"></span>
  </div>

  <div style="position: relative; height: 300px; margin: 0 12px; border-radius: 22px; background: #142238; border: 1px solid rgba(255,255,255,.07); overflow: hidden">
    <span style="position: absolute; left: 0; top: 12px; padding-left: 14px; font-size: 13px; color: #9aa6b8">高</span>
    <span style="position: absolute; left: 0; bottom: 12px; padding-left: 14px; font-size: 13px; color: #9aa6b8">低</span>
    <div style="position: absolute; left: 150px; top: 0; bottom: 0; width: 2px; background: rgba(216,191,143,.55)"></div>
    <sc-for list="{{notes}}" as="n" hint-placeholder-count="9">
      <div style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; width: {{n.w}}px; height: 14px; border-radius: 7px; background: rgba(216,191,143,.28); border: 1px solid rgba(216,191,143,.5)"></div>
    </sc-for>
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="20">
      <div style="position: absolute; left: {{d.x}}px; top: {{d.y}}px; width: 8px; height: 8px; border-radius: 4px; background: {{d.c}}"></div>
    </sc-for>
    <div style="position: absolute; left: 143px; top: 158px; width: 16px; height: 16px; border-radius: 8px; background: #e9b872; box-shadow: 0 0 0 6px rgba(233,184,114,.25)"></div>
  </div>

  <div style="margin: 0 20px; height: 64px; border-radius: 32px; background: rgba(233,184,114,.14); border: 1px solid rgba(233,184,114,.45); display: flex; align-items: center; justify-content: center; gap: 10px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e9b872" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
    <span style="font-size: 22px; font-weight: 700; color: #e9b872">低了一点，往上提</span>
  </div>

  <div style="padding: 0 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; flex-grow: 1; justify-content: center">
    <p style="margin: 0; font-size: 18px; color: #6f7c91">（上一句）</p>
    <p style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 32px; font-weight: 700; letter-spacing: 2px; text-align: center"><span style="color: #d8bf8f">好一朵美丽</span><span style="color: #f4efe6">的茉莉花</span></p>
    <p style="margin: 0; font-size: 20px; color: #9aa6b8">芬芳美丽满枝桠</p>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
    <a href="Result.dc.html" style="width: 92px; height: 92px; border-radius: 46px; background: #ee8574; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 0 0 8px rgba(238,133,116,.18)">
      <span style="width: 30px; height: 30px; border-radius: 6px; background: #0d1626"></span>
    </a>
    <span style="font-size: 17px; color: #f4efe6">唱完了，点这里</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const notes = [
      { x: 20, y: 200, w: 60 }, { x: 84, y: 170, w: 40 }, { x: 128, y: 160, w: 70 },
      { x: 202, y: 130, w: 50 }, { x: 256, y: 110, w: 80 }, { x: 340, y: 140, w: 60 }
    ];
    const pts = [[22,203,'g'],[34,202,'g'],[46,204,'g'],[58,201,'g'],[70,203,'g'],[88,173,'g'],[100,172,'g'],[112,176,'a'],[130,170,'a'],[138,168,'a']];
    const col = { g: '#7fd1ae', a: '#e9b872' };
    return {
      notes,
      dots: pts.map(([x, y, k]) => ({ x, y, c: col[k] }))
    };
  }
}
</script>
</body>
</html>
