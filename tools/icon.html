<!DOCTYPE html><html><head><style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:#0b1424}
svg{position:absolute;inset:0}
.ch{position:absolute;inset:0;display:grid;place-items:center;font:600 420px/1 "Noto Serif CJK SC",serif;
  background:linear-gradient(170deg,#fbf1d9 0%,#e3c891 45%,#b38a4e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  padding-bottom:24px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.5))}
</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024">
 <defs>
  <radialGradient id="bg" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#2a3f66"/><stop offset=".45" stop-color="#17284a"/><stop offset="1" stop-color="#0b1424"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#f4e6c4"/><stop offset=".5" stop-color="#cdae73"/><stop offset="1" stop-color="#8f6d37"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="48%" r="38%"><stop offset="0" stop-color="#d8bf8f" stop-opacity=".16"/><stop offset="1" stop-color="#d8bf8f" stop-opacity="0"/></radialGradient>
 </defs>
 <rect width="1024" height="1024" fill="url(#bg)"/>
 <circle cx="512" cy="512" r="390" fill="url(#glow)"/>
 <circle cx="512" cy="512" r="352" fill="none" stroke="url(#gold)" stroke-width="7"/>
 <circle cx="512" cy="512" r="392" fill="none" stroke="#d8bf8f" stroke-opacity=".22" stroke-width="2"/>
</svg>
<div class="ch">唱</div></body></html>
